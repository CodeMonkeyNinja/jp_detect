[package]
name        = "jp_detect"
version     = "0.2.3"
edition     = "2021"
description = "Real-time scene text detection using DBNet and an embedded ONNX model."
license     = "MIT"
keywords    = ["text-detection", "dbnet", "ocr", "onnx", "image"]
categories  = ["computer-vision", "multimedia::images"]
repository  = "https://github.com/codemonkeyninja/jp_detect"
homepage    = "https://github.com/codemonkeyninja/jp_detect"
readme      = "README.md"
# Large test fixtures are excluded from crates.io packages.
exclude     = ["tests/fixtures/*.png", "mirror/", "examples/output/"]

# The bundled ONNX model is ~4.7 MB and is compiled into the binary when the
# `onnx` feature is enabled.  Pass a model path to `build_text_detector` to
# use an external model file instead.
[features]
default = []
onnx    = ["ort", "imageproc"]

[[example]]
name              = "detect_and_draw"
required-features = ["onnx"]

[dependencies]
anyhow    = "1.0"
image     = { version = "0.25", default-features = false, features = ["png"] }
ort       = { version = "2.0.0-rc.12", features = ["ndarray"], optional = true }
imageproc = { version = "0.25", optional = true }
